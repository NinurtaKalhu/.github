<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="40%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="logoGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#F68B1D" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#F68B1D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="logoGlowRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F68B1D" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F68B1D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hexPattern" width="30" height="52" patternUnits="userSpaceOnUse" patternTransform="scale(0.6)">
      <path d="M15 0 L30 13 L30 39 L15 52 L0 39 L0 13 Z" fill="none" stroke="#F68B1D" stroke-opacity="0.04" stroke-width="0.5"/>
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#000" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F68B1D" stroke-opacity="0.03" stroke-width="0.5"/>
    </pattern>
    <clipPath id="rounded">
      <rect width="900" height="280" rx="8"/>
    </clipPath>
  </defs>
  <!-- Background -->
  <rect width="900" height="280" fill="url(#bg)" clip-path="url(#rounded)"/>
  <rect width="900" height="280" fill="url(#hexPattern)" clip-path="url(#rounded)"/>
  <rect width="900" height="280" fill="url(#grid)" clip-path="url(#rounded)"/>
  <rect width="900" height="280" fill="url(#scanlines)" clip-path="url(#rounded)"/>
