<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#10131a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <!-- Orange glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F68B1D;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#F68B1D;stop-opacity:0"/>
    </radialGradient>
    <!-- Scan line pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#F68B1D" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F68B1D" stroke-opacity="0.06" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bg)"/>

  <!-- Grid overlay -->
  <rect width="800" height="200" fill="url(#grid)"/>

  <!-- Scan lines -->
  <rect width="800" height="200" fill="url(#scanlines)"/>

  <!-- Center glow -->
  <ellipse cx="400" cy="100" rx="300" ry="100" fill="url(#glow)"/>

  <!-- Top border line -->
  <line x1="50" y1="30" x2="750" y2="30" stroke="#F68B1D" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Bottom border line -->
  <line x1="50" y1="170" x2="750" y2="170" stroke="#F68B1D" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Left bracket -->
  <path d="M 60 40 L 60 160" stroke="#F68B1D" stroke-opacity="0.4" stroke-width="1.5"/>
  <path d="M 60 40 L 80 40" stroke="#F68B1D" stroke-opacity="0.4" stroke-width="1.5"/>
  <path d="M 60 160 L 80 160" stroke="#F68B1D" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Right bracket -->
  <path d="M 740 40 L 740 160" stroke="#F68B1D" stroke-opacity="0.4" stroke-width="1.5"/>
  <path d="M 740 40 L 720 40" stroke="#F68B1D" stroke-opacity="0.4" stroke-width="1.5"/>
  <path d="M 740 160 L 720 160" stroke="#F68B1D" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Center diamond -->
  <path d="M 400 50 L 420 70 L 400 90 L 380 70 Z" fill="none" stroke="#F68B1D" stroke-opacity="0.5" stroke-width="1"/>
  <path d="M 400 110 L 420 130 L 400 150 L 380 130 Z" fill="none" stroke="#F68B1D" stroke-opacity="0.5" stroke-width="1"/>

  <!-- EDMRN text -->
  <text x="400" y="88" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="700" fill="#F68B1D" letter-spacing="8">EDMRN</text>

  <!-- Subtitle -->
  <text x="400" y="118" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#F68B1D" opacity="0.7" letter-spacing="4">ELITE DANGEROUS MULTI-ROUTE NAVIGATION</text>

  <!-- Version -->
  <text x="400" y="145" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#F68B1D" opacity="0.4" letter-spacing="2">v3.3.0</text>

  <!-- Corner accents -->
  <circle cx="60" cy="40" r="2" fill="#F68B1D" opacity="0.6"/>
  <circle cx="60" cy="160" r="2" fill="#F68B1D" opacity="0.6"/>
  <circle cx="740" cy="40" r="2" fill="#F68B1D" opacity="0.6"/>
  <circle cx="740" cy="160" r="2" fill="#F68B1D" opacity="0.6"/>

  <!-- Horizontal scan line -->
  <line x1="100" y1="100" x2="300" y2="100" stroke="#F68B1D" stroke-opacity="0.15" stroke-width="0.5"/>
  <line x1="500" y1="100" x2="700" y2="100" stroke="#F68B1D" stroke-opacity="0.15" stroke-width="0.5"/>
</svg>
